const categories=["Все","Завтраки","Брускетты и боулы","Салаты","Супы","Горячие блюда","Паста","Стейки и рыба","Бургеры и закуски","Пицца","Роллы","Гарниры","Соусы","Десерты","Напитки"];
let selected="Все", table=1, cart={}, orders=JSON.parse(localStorage.getItem("fratelli_orders")||"{}"), history=JSON.parse(localStorage.getItem("fratelli_history")||"[]"), expandedOrders={};
const $=id=>document.getElementById(id), money=n=>n.toLocaleString("ru-RU")+" сом";
function initTables(){let s=$("table");s.innerHTML="";for(let i=1;i<=30;i++){let o=document.createElement("option");o.value=i;o.textContent="Столик "+i;s.append(o)}s.value=table}
function renderTabs(){$("tabs").innerHTML=categories.map(c=>`<button class="tab ${selected===c?'active':''}" data-cat="${c}">${c}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{selected=b.dataset.cat;renderTabs();renderItems()})}
function renderItems(){let q=$("search").value.toLowerCase().trim();let arr=MENU.filter(x=>(selected==="Все"||x.category===selected)&&x.name.toLowerCase().includes(q));$("items").innerHTML=arr.map((x,i)=>`<article class="item"><div class="name">${x.name}</div><div class="cat">${x.category}</div><div class="bottom"><span class="price">${money(x.price)}</span><button class="add" data-add="${MENU.indexOf(x)}">＋</button></div></article>`).join("")||'<div class="muted">Ничего не найдено</div>';document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(+b.dataset.add))}
function add(i){let x=MENU[i],key=x.name+"|"+x.price;if(!cart[key])cart[key]={...x,qty:0,note:""};cart[key].qty++;renderCart()}
function change(k,delta){cart[k].qty+=delta;if(cart[k].qty<=0)delete cart[k];renderCart()}
function renderCart(){let entries=Object.entries(cart);$("cart").innerHTML=entries.length?entries.map(([k,x])=>`<div class="cartrow"><div><b>${x.name}</b><div class="muted">${money(x.price)} · ${money(x.price*x.qty)}</div><input style="width:100%;padding:8px;margin-top:6px" placeholder="Комментарий к блюду" value="${(x.note||"").replace(/"/g,"&quot;")}" data-note="${encodeURIComponent(k)}"></div><div class="controls"><button class="small" data-dec="${encodeURIComponent(k)}">−</button><b>${x.qty}</b><button class="small" data-inc="${encodeURIComponent(k)}">＋</button></div></div>`).join(""):'<div class="muted">Пока ничего не добавлено</div>';let total=entries.reduce((s,[k,x])=>s+x.price*x.qty,0);$("total").textContent=money(total);$("tableLabel").textContent="· столик "+table;
document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>change(decodeURIComponent(b.dataset.dec),-1));document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>change(decodeURIComponent(b.dataset.inc),1));document.querySelectorAll("[data-note]").forEach(inp=>inp.onchange=()=>{cart[decodeURIComponent(inp.dataset.note)].note=inp.value})}
function persist(){localStorage.setItem("fratelli_orders",JSON.stringify(orders));localStorage.setItem("fratelli_history",JSON.stringify(history))}
function detailHTML(o){return `<div class="order-detail">${(o.items||[]).map(x=>`<div class="detail-line"><span>${x.name} × ${x.qty||1}${x.note?`<br><span class="muted">${x.note}</span>`:""}</span><b>${money(x.price*(x.qty||1))}</b></div>`).join("")}<div class="total"><span>Итого</span><span>${money(o.total||0)}</span></div>${o.note?`<div class="muted">Пожелания: ${o.note}</div>`:""}</div>`}
function renderOrders(){let keys=Object.keys(orders).sort((a,b)=>Number(a)-Number(b));$("orders").innerHTML=keys.length?keys.map(t=>{let o=orders[t],expanded=!!expandedOrders[t];return `<div class="order"><b>Столик ${t}</b> · ${money(o.total||0)}<div class="muted">${(o.items||[]).length} позиций · ${o.time||""}</div><button class="tab" data-toggle="${t}">${expanded?"Скрыть позиции":"Показать позиции"}</button><button class="tab" data-load="${t}">Изменить заказ</button><button class="tab" data-close="${t}">Закрыть стол</button>${expanded?detailHTML(o):""}</div>`}).join(""):'Пока нет сохранённых заказов';
document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let t=b.dataset.toggle;expandedOrders[t]=!expandedOrders[t];renderOrders()});
document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{table=+b.dataset.load;$("table").value=table;cart={};(orders[table].items||[]).forEach(x=>{let k=x.name+"|"+x.price;cart[k]={...x}});$("orderNote").value=orders[table].note||"";renderCart();window.scrollTo({top:0,behavior:"smooth"})});

function renderHistory(){let rows=history.slice().sort((a,b)=>(b.savedAtMs||0)-(a.savedAtMs||0));$("history").innerHTML=rows.length?rows.map((o,i)=>`<div class="history-entry"><b>Столик ${o.table??"—"}</b> · ${money(o.total||0)}<div class="muted">${o.closedAt||o.savedAt||o.time||"Дата не указана"} · ${o.status||"Сохранён"}</div><button class="tab" data-hist="${i}">Посмотреть чек</button><div id="histdetail${i}" class="hidden">${detailHTML(o)}</div></div>`).join(""):'История пока пуста';document.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>{let el=$("histdetail"+b.dataset.hist);el.classList.toggle("hidden");b.textContent=el.classList.contains("hidden")?"Посмотреть чек":"Скрыть чек"})}

$("saveOrder").onclick=()=>{if(!Object.keys(cart).length){alert("Добавь блюда в заказ");return}let entries=Object.values(cart).map(x=>({...x})),total=entries.reduce((s,x)=>s+x.price*x.qty,0),now=new Date(),stamp=now.toLocaleString("ru-RU");orders[table]={items:entries,total,note:$("orderNote").value,time:now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),savedAt:stamp};history.unshift({table:Number(table),items:entries,total,note:$("orderNote").value,status:"Сохранён",savedAt:stamp,savedAtMs:now.getTime()});persist();renderOrders();renderHistory();alert("Заказ столика "+table+" сохранён. Он также добавлен в историю.")};
$("clearCart").onclick=()=>{if(confirm("Очистить текущий заказ?")){cart={};$("orderNote").value="";renderCart()}};
